<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mithra • Settings</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/themes.css"></head>
<body><header class="mobile-head"><a class="icon-btn" href="../index.html">←</a><div><b>Settings</b><small>Personalize Mithra</small></div></header><main class="page"><section class="card settings"><h2>Appearance</h2><label>Theme<select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label></section>
<section class="card settings"><h2>Learning</h2><label class="switch">Save chat history <input id="saveChat" type="checkbox" checked></label><label class="switch">Typing animation <input id="typing" type="checkbox" checked></label></section>
<section class="card settings"><h2>Backup</h2><p class="muted">Keep a copy before clearing browser data.</p><div class="button-row"><button id="export" class="secondary-btn">📤 Export Backup</button><label class="secondary-btn file-label">📥 Import Backup<input id="import" type="file" accept=".json"></label></div></section>
<section class="card settings"><h2>Danger Zone</h2><button id="reset" class="danger-btn">Clear All Mithra Data</button></section></main><nav class="bottom-nav"><a href="../index.html">🏠<span>Home</span></a><a href="chat.html">💬<span>Chat</span></a><a href="lessons.html">📚<span>Learn</span></a><a class="active" href="settings.html">⚙️<span>Settings</span></a></nav>

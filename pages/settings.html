<body><header class="topbar"><a class="brand" href="../index.html"><span class="logo">M</span><span>Mithra</span></a><nav><a href="../index.html">Home</a><a href="chat.html">Chat</a><a class="active" href="settings.html">Settings</a><a href="about.html">About</a></nav><button class="icon-btn" id="themeBtn">☾</button></header>
<main class="container narrow"><h1>Settings</h1><p class="muted">Customize your local Mithra experience.</p>
<section class="card settings-section"><h2>Appearance</h2><label>Theme<select id="themeSelect"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label></section>
<section class="card settings-section"><h2>Chat</h2><label class="switch-row">Save chat history <input type="checkbox" id="saveChat" checked></label><label class="switch-row">Typing animation <input type="checkbox" id="typing" checked></label></section>
<section class="card settings-section"><h2>Data</h2><div class="button-row"><button id="clearHistory" class="secondary-btn">Clear Chat History</button><button id="resetApp" class="danger-btn">Reset Mithra</button></div></section></main>
<script src="../js/storage.js"></script><script src="../js/ui.js"></script><script src="../js/settings.js"></script></body></html>
